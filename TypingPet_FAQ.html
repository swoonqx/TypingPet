<style>
:root {
  --bg: #f2f4f9;
  --surface: #ffffff;
  --ink: #1c2033;
  --ink-soft: #545b73;
  --line: #dde1ec;
  --accent: #0d8f7f;
  --accent-soft: #dcf3ef;
  --key-top: #ffffff;
  --key-side: #c5cbdc;
  --key-ink: #1c2033;
  --code-bg: #eceff6;
  --tree-bg: #1c2033;
  --tree-ink: #d8dcec;
  --tree-dim: #7f88a6;
  --font-display: "Jua", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --font-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Consolas", "D2Coding", monospace;
  --h1-weight: 400;
}
:root:lang(ja) {
  --font-display: "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-body: "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --h1-weight: 700;
}
:root:lang(zh-CN) {
  --font-display: "Noto Sans SC", "Microsoft YaHei UI", "PingFang SC", sans-serif;
  --font-body: "Noto Sans SC", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
  --h1-weight: 700;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #12151e;
    --surface: #1a1e2b;
    --ink: #e8eaf3;
    --ink-soft: #a0a7bf;
    --line: #2a3043;
    --accent: #3cc9b5;
    --accent-soft: #163a37;
    --key-top: #2b3146;
    --key-side: #0d1018;
    --key-ink: #e8eaf3;
    --code-bg: #242a3b;
    --tree-bg: #0d1018;
    --tree-ink: #d8dcec;
    --tree-dim: #6f7896;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12151e;
  --surface: #1a1e2b;
  --ink: #e8eaf3;
  --ink-soft: #a0a7bf;
  --line: #2a3043;
  --accent: #3cc9b5;
  --accent-soft: #163a37;
  --key-top: #2b3146;
  --key-side: #0d1018;
  --key-ink: #e8eaf3;
  --code-bg: #242a3b;
  --tree-bg: #0d1018;
  --tree-ink: #d8dcec;
  --tree-dim: #6f7896;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  padding-inline: 16px;
  padding-block: 32px 56px;
}
.wrap { max-width: 720px; margin: 0 auto; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
}
.eyebrow {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--accent);
  text-transform: uppercase;
}
.langs {
  display: flex;
  gap: 4px;
  padding: 3px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.langs button {
  min-width: 44px;
  padding: 5px 10px;
  font-family: var(--font-mono);
  font-size: 12.5px;
  letter-spacing: 0.04em;
  color: var(--ink-soft);
  background: transparent;
  border: 0;
  border-radius: 7px;
  cursor: pointer;
}
.langs button:hover { color: var(--ink); }
.langs button[aria-pressed="true"] {
  color: #ffffff;
  background: var(--accent);
}
:root[data-theme="dark"] .langs button[aria-pressed="true"] { color: #0b1a18; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .langs button[aria-pressed="true"] { color: #0b1a18; }
}

header { display: flex; flex-direction: column; gap: 6px; margin-bottom: 28px; }
h1 {
  font-family: var(--font-display);
  font-weight: var(--h1-weight);
  font-size: clamp(34px, 8vw, 48px);
  line-height: 1.2;
  margin: 0;
  text-wrap: balance;
}
.lede { margin: 0; color: var(--ink-soft); }

.search {
  display: block;
  width: 100%;
  margin-bottom: 20px;
  padding: 11px 14px;
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.search::placeholder { color: var(--ink-soft); }
.search:focus-visible, summary:focus-visible, a:focus-visible, .langs button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.faq { display: flex; flex-direction: column; gap: 10px; }
details {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
}
summary {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 16px 18px;
  cursor: pointer;
  list-style: none;
  font-weight: 600;
  line-height: 1.5;
  border-radius: 12px;
}
summary::-webkit-details-marker { display: none; }
summary .q { flex: 1; min-width: 0; padding-top: 3px; }
summary::after {
  content: "";
  flex: none;
  width: 9px;
  height: 9px;
  margin: 10px 4px 0 0;
  border-right: 2px solid var(--ink-soft);
  border-bottom: 2px solid var(--ink-soft);
  transform: rotate(45deg);
  transition: transform 0.15s ease;
}
details[open] > summary::after { transform: rotate(-135deg); margin-top: 14px; }

.key {
  flex: none;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  font-family: var(--font-mono);
  font-size: 15px;
  color: var(--key-ink);
  background: var(--key-top);
  border: 1px solid var(--key-side);
  border-radius: 8px;
  box-shadow: 0 3px 0 var(--key-side);
  font-variant-numeric: tabular-nums;
}

.a { padding: 0 18px 18px 66px; }
.a p { margin: 0 0 10px; }
.a p:last-child { margin-bottom: 0; }
.a .note { color: var(--ink-soft); font-size: 14.5px; }

.steps {
  margin: 0 0 14px;
  padding: 0;
  list-style: none;
  counter-reset: step;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.steps li {
  counter-increment: step;
  display: flex;
  gap: 10px;
  align-items: baseline;
}
.steps li::before {
  content: counter(step);
  flex: none;
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 50%;
  transform: translateY(-1px);
}

code {
  font-family: var(--font-mono);
  font-size: 0.88em;
  padding: 1px 6px;
  background: var(--code-bg);
  border-radius: 5px;
  white-space: nowrap;
}
mark.fix {
  background: var(--accent-soft);
  color: var(--ink);
  padding: 1px 6px;
  border-radius: 5px;
  font-weight: 500;
}

figure { margin: 14px 0 0; }
figure img {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #ffffff;
}
figure.tall img { max-width: 340px; }
figcaption { margin-top: 8px; font-size: 13.5px; color: var(--ink-soft); line-height: 1.6; }

.tree-scroll { overflow-x: auto; margin: 12px 0; border-radius: 10px; }
.tree {
  margin: 0;
  padding: 14px 18px;
  min-width: max-content;
  font-family: var(--font-mono);
  font-size: 13.5px;
  line-height: 1.7;
  color: var(--tree-ink);
  background: var(--tree-bg);
}
.tree .dim { color: var(--tree-dim); }
.tree .ok { color: #58d6c2; }

.empty { display: none; padding: 20px 4px; color: var(--ink-soft); }
.empty.show { display: block; }

footer {
  margin-top: 32px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
  display: flex;
  flex-wrap: wrap;
  gap: 8px 20px;
  justify-content: space-between;
  font-size: 14px;
  color: var(--ink-soft);
}
footer a { color: var(--accent); font-weight: 500; text-underline-offset: 3px; }

@media (max-width: 480px) {
  body { padding-block: 24px 40px; }
  summary { padding: 14px; gap: 12px; }
  .a { padding: 0 14px 16px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  summary::after { transition: none; }
}
</style>

<div class="wrap">
  <div class="topbar">
    <span class="eyebrow">TypingPet</span>
    <div class="langs" role="group" aria-label="Language" id="langs">
      <button type="button" data-lang="ko" lang="ko" aria-pressed="true">KR</button>
      <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="ja" lang="ja" aria-pressed="false">JP</button>
      <button type="button" data-lang="zh-CN" lang="zh-CN" aria-pressed="false">CN</button>
    </div>
  </div>

  <header>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
  </header>

  <input class="search" id="q" type="search" autocomplete="off">

  <div class="faq" id="faq"></div>
  <p class="empty" id="empty"></p>

  <footer>
    <span id="foot-note"></span>
    <a id="foot-link" href="https://github.com/swoonqx/TypingPet/releases/latest" target="_blank" rel="noopener"></a>
  </footer>
</div>

  var TREE =
    '<div class="tree-scroll"><pre class="tree"><span class="ok">TypingPet\\</span>\n' +
    '├─ TypingPet.exe\n' +
    '└─ images\\        <span class="dim">← same folder as the exe</span>\n' +
    '   ├─ <span class="dim">(image files)</span></pre></div>';

  function tree(hint, files) {
    return TREE.replace("same folder as the exe", hint).replace("image files", files);
  }

  function fig(src, alt, caption, tall) {
    return '<figure' + (tall ? ' class="tall"' : '') + '><img src="' + src + '" alt="' + alt + '" loading="lazy">' +
      '<figcaption>' + caption + '</figcaption></figure>';
  }

  var input = document.getElementById("q");
  var faq = document.getElementById("faq");
  var empty = document.getElementById("empty");
  var buttons = Array.prototype.slice.call(document.querySelectorAll("#langs button"));

  function applyFilter() {
    var term = input.value.trim().toLowerCase();
    var shown = 0;
    Array.prototype.forEach.call(faq.children, function (d) {
      var hit = !term || d.textContent.toLowerCase().indexOf(term) !== -1;
      d.hidden = !hit;
      if (hit) shown++;
    });
    empty.classList.toggle("show", shown === 0);
  }

  function setLang(code, remember) {
    var t = L[code] || L.ko;
    code = L[code] ? code : "ko";
    document.documentElement.lang = code;
    document.getElementById("title").textContent = t.title;
    document.getElementById("lede").textContent = t.lede;
    document.getElementById("foot-note").innerHTML = t.footNote.replace("{X}", '<a href="https://x.com/swoonqx" target="_blank" rel="noopener">X:@swoonqx</a>');
    document.getElementById("foot-link").textContent = t.footLink;
    empty.textContent = t.empty;
    input.placeholder = t.search;
    input.setAttribute("aria-label", t.search);
    var opened = Array.prototype.map.call(faq.children, function (d) { return d.open; });
    faq.innerHTML = t.items.map(function (it, i) {
      return '<details' + (opened[i] ? ' open' : '') + '><summary><span class="key">' + (i + 1) + '</span><span class="q">' + it.q +
        '</span></summary><div class="a">' + it.a + '</div></details>';
    }).join("");
    buttons.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === code)); });
    applyFilter();
    if (remember) { try { localStorage.setItem("tp-faq-lang", code); } catch (e) {} }
  }

  function initial() {
    var saved = null;
    try { saved = localStorage.getItem("tp-faq-lang"); } catch (e) {}
    if (saved && L[saved]) return saved;
    var n = (navigator.language || "ko").toLowerCase();
    if (n.indexOf("ko") === 0) return "ko";
    if (n.indexOf("ja") === 0) return "ja";
    if (n.indexOf("zh") === 0) return "zh-CN";
    if (n.indexOf("en") === 0) return "en";
    return "ko";
  }

  buttons.forEach(function (b) {
    b.addEventListener("click", function () { setLang(b.dataset.lang, true); });
  });
  input.addEventListener("input", applyFilter);
  setLang(initial(), false);
})();
</script>
